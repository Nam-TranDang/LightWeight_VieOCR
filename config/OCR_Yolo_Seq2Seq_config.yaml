# --- Common Settings ---
device: "cuda"
input_image_path: "/home/nam/Downloads/raw_data/ttcp_vn.png"
output_dir: "/home/nam/Downloads/source/prelabeller/output"

# --- YOLO Detection Settings ---
yolo:
  weights: "checkpoint/Text_Detection/best_yolo11_text.pt"
  variant: "yolo_v11_m"
  nc: 1
  input_size: [480, 480] # [height, width]
  conf_thres: 0.5
  iou_thres: 0.5

# --- Seq2Seq Recognition Settings ---
seq2seq:
  weights: "checkpoint/Text_Recognition/vgg_seq2seq.pth"
  height: 32 # Input height for recognition
  
  # Vocabulary (Ensure space is at the end)
  vocab: "aAàÀảẢãÃáÁạẠăĂằẰẳẲẵẴắẮặẶâÂầẦẩẨẫẪấẤậẬbBcCdDđĐeEèÈẻẺẽẼéÉẹẸêÊềỀểỂễỄếẾệỆfFgGhHiIìÌỉỈĩĨíÍịỊjJkKlLmMnNoOòÒỏỎõÕóÓọỌôÔồỒổỔỗỖốỐộỘơƠờỜởỞỡỠớỚợỢpPqQrRsStTuUùÙủỦũŨúÚụỤưƯừỪửỬữỮứỨựỰvVwWxXyYỳỲỷỶỹỸýÝỵỴzZ0123456789!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~ "
  
  backbone: vgg19_bn
  
  cnn:
    hidden: 256
    ss: [[2, 2], [2, 2], [2, 1], [2, 1], [1, 1]]
    ks: [[2, 2], [2, 2], [2, 1], [2, 1], [1, 1]]

  seq_modeling:
    encoder_hidden: 256
    decoder_hidden: 256
    img_channel: 256
    decoder_embedded: 256
    dropout: 0.1