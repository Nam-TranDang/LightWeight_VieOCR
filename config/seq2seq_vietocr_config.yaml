  vocab: "aAàÀảẢãÃáÁạẠăĂằẰẳẲẵẴắẮặẶâÂầẦẩẨẫẪấẤậẬbBcCdDđĐeEèÈẻẺẽẼéÉẹẸêÊềỀểỂễỄếẾệỆfFgGhHiIìÌỉỈĩĨíÍịỊjJkKlLmMnNoOòÒỏỎõÕóÓọỌôÔồỒổỔỗỖốỐộỘơƠờỜởỞỡỠớỚợỢpPqQrRsStTuUùÙủỦũŨúÚụỤưƯừỪửỬữỮứỨựỰvVwWxXyYỳỲỷỶỹỸýÝỵỴzZ0123456789!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~ "

  # This section mirrors the original VietOCR config structure
  backbone: vgg19_bn

  cnn:
    hidden: 256
    # Pooling stride size (Essential for VGG)
    ss:
      - [2, 2]
      - [2, 2]
      - [2, 1]
      - [2, 1]
      - [1, 1]
    # Pooling kernel size
    ks:
      - [2, 2]
      - [2, 2]
      - [2, 1]
      - [2, 1]
      - [1, 1]

  # Specific parameters for the LSTM (Seq2Seq) head
  seq_modeling:
    encoder_hidden: 256
    decoder_hidden: 256
    img_channel: 256
    decoder_embedded: 256
    dropout: 0.1